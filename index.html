<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Rose Day ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Handwritten Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 🔊 Music -->
<audio id="bgMusic" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>
<div id="musicToggle" class="mute">🔇</div>

<!-- 🌹 Rose -->
<div class="scene">
  <div class="rose">
    <div class="petal p1"></div>
    <div class="petal p2"></div>
    <div class="petal p3"></div>
    <div class="petal p4"></div>
    <div class="petal p5"></div>
    <div class="stem"></div>
    <div class="leaf l1"></div>
    <div class="leaf l2"></div>
  </div>
</div>

<!-- 💌 Card -->
<div class="card hidden" id="card">
  <h1>Happy Rose Day 🌹</h1>
  <p class="name">Bangaram</p>

  <p>
    A single rose can be my garden,  
    but a single love like <b>you</b> is my whole world.
  </p>

  <p class="love">Will you be my forever? ❤️</p>

  <button onclick="magic()">Tap for Magic ✨</button>
</div>

<div id="petalContainer"></div>

<script src="script.js"></script>
</body>
</html>
